<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Medidas</title>

<link rel="stylesheet" href="style.css">

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="container">
    <h2>Ficha de Medidas</h2>
    <p class="sub">Preencha com atenção para um molde perfeito</p>

    <input type="text" id="nome" placeholder="Seu nome">
    <input type="text" id="whats" placeholder="WhatsApp">

    <div class="field">
        <input type="number" id="busto" placeholder="Circunferênica Busto (cm)">
        <span class="help" onclick="abrirModal('busto')">?</span>
    </div>

    <div class="field">
        <input type="number" id="cintura" placeholder="Circunferência Cintura (cm)">
        <span class="help" onclick="abrirModal('cintura')">?</span>
    </div>

    <div class="field">
        <input type="number" id="alturaFrente" placeholder="Altura Frente (cm)">
        <span class="help" onclick="abrirModal('frente')">?</span>
    </div>

    <div class="field">
        <input type="number" id="alturaCostas" placeholder="Altura Costas (cm)">
        <span class="help" onclick="abrirModal('costas')">?</span>
    </div>

    <div class="field">
        <input type="number" id="ombro" placeholder="Ombro a Ombro (cm)">
        <span class="help" onclick="abrirModal('ombro')">?</span>
    </div>

    <button onclick="gerarPDF()">Gerar PDF + WhatsApp</button>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modal-box">
        <span class="close" onclick="fecharModal()">×</span>

        <img id="modal-img" class="modal-img">
        <p id="texto"></p>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
