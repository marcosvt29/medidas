<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Medidas</title>

<link rel="stylesheet" href="style.css">

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="container">
    <h2>Ficha de Medidas</h2>
    <p class="sub">Preencha com atenção para um molde perfeito</p>

    <input type="text" id="nome" placeholder="Seu nome">
    <input type="text" id="whats" placeholder="WhatsApp">

    <!-- CAMPOS DINÂMICOS -->
    <div id="campos-medidas"></div>

    <button onclick="gerarPDF()">Gerar PDF + WhatsApp</button>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modal-box">
        <span class="close" onclick="fecharModal()">×</span>
        <img id="modal-img" class="modal-img">
        <p id="texto"></p>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
